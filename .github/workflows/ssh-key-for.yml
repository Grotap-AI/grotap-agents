name: ssh-key-for

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ssh-key-for tests
        run: bash agents/scripts/ssh-key-for.test.sh

      - name: health-monitor key fail-closed
        run: bash agents/scripts/health-monitor.test.sh

      - name: orchestrator-run git auth never rewrites helpers
        run: bash agents/tests/test_git_auth_no_rewrite.sh

      - name: orchestrator-run security
        run: bash agents/tests/test_orchestrator_run_security.sh

      - name: Twin drift guard
        run: |
          # These sums match grotap-platform (dead host comments removed, 2026-10-11).
          # Bump each expected sum in the same change that updates that
          # file, and update the platform copy together.
          check() {
            local path="$1" expected="$2" actual
            actual="$(sha256sum "$path" | awk '{print $1}')"
            echo "$path $actual"
            test "$actual" = "$expected"
          }
          check agents/scripts/ssh-key-for.sh 339955748dcee41c757605e67219d9f5f86bcc33fc5737d037f515f69c40ff90
          check agents/scripts/ssh-key-for.test.sh b850fab4bd8d890b31a52c4b0c32463835bd54e6621e2698212c161b6263ef1e
          check agents/fleet-aliases.json df33dec620971d9656e43358973834f7655e23796e79a1939b442c9244740d3b
