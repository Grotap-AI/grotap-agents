name: ssh-key-for

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ssh-key-for tests
        run: bash agents/scripts/ssh-key-for.test.sh

      - name: health-monitor key fail-closed
        run: bash agents/scripts/health-monitor.test.sh

      - name: Twin drift guard
        run: |
          # These sums match grotap-platform #277 (G6b, released IPs dropped, 2026-10-03).
          # Bump each expected sum in the same change that updates that
          # file, and update the platform copy together.
          check() {
            local path="$1" expected="$2" actual
            actual="$(sha256sum "$path" | awk '{print $1}')"
            echo "$path $actual"
            test "$actual" = "$expected"
          }
          check agents/scripts/ssh-key-for.sh 1fe4d77f9017808a7118a74948b7e95d4e079c30b8101a3cd1be9651bd00c3a4
          check agents/scripts/ssh-key-for.test.sh b7fc392d372f1dfb87eb5f4d51e006ae84885da262794337cfcc94a34776fbf8
          check agents/fleet-aliases.json b42f94d2c95e3b643ef99a1711a7051b670aa4c794a78103ad1609f9fd9e113a
