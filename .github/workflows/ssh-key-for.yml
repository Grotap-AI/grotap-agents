name: ssh-key-for

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ssh-key-for tests
        run: bash agents/scripts/ssh-key-for.test.sh

      - name: health-monitor key fail-closed
        run: bash agents/scripts/health-monitor.test.sh

      - name: Twin drift guard
        run: |
          # These sums match the grotap-platform should-fix PR (anchored ops-host check, 2026-10-03).
          # Bump each expected sum in the same change that updates that
          # file, and update the platform copy together.
          check() {
            local path="$1" expected="$2" actual
            actual="$(sha256sum "$path" | awk '{print $1}')"
            echo "$path $actual"
            test "$actual" = "$expected"
          }
          check agents/scripts/ssh-key-for.sh f0759ce795213bfda2bd41a9a60f138c0ddca158c3e76fe705860040fa6abb92
          check agents/scripts/ssh-key-for.test.sh 0dfe96a9a44c8103652473695f4e37df02868e27d90729014b3cd43ec85bdc4d
          check agents/fleet-aliases.json df33dec620971d9656e43358973834f7655e23796e79a1939b442c9244740d3b
