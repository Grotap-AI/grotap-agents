name: ssh-key-for

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ssh-key-for tests
        run: bash agents/scripts/ssh-key-for.test.sh

      - name: health-monitor key fail-closed
        run: bash agents/scripts/health-monitor.test.sh

      - name: Twin drift guard
        run: |
          # These sums match the grotap-platform openreplay-02 cleanup PR (2026-10-03; supersedes #271).
          # Bump each expected sum in the same change that updates that
          # file, and update the platform copy together.
          check() {
            local path="$1" expected="$2" actual
            actual="$(sha256sum "$path" | awk '{print $1}')"
            echo "$path $actual"
            test "$actual" = "$expected"
          }
          check agents/scripts/ssh-key-for.sh b8b0abc47c640804d51e982dbeaa03f5f5c394699fb8ff341eadb9dbdd4a9557
          check agents/scripts/ssh-key-for.test.sh 22c416126b0cde43058a848dc553b133574ea4593ed4360c28f47399f35e939f
          check agents/fleet-aliases.json df33dec620971d9656e43358973834f7655e23796e79a1939b442c9244740d3b
